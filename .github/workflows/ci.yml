name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --dev --extra production
      - name: Lint
        run: uv run ruff check src services tests migrations scripts
      - name: Typecheck
        run: uv run mypy src
      - name: Test
        run: uv run python -m pytest --cov=judicial_ai --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.xml
      - name: Migration smoke test
        env:
          DATABASE_URL: sqlite:///./data/ci.db
          AUTO_CREATE_SCHEMA: "false"
        run: uv run python -m alembic upgrade head

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build image
        run: docker build -t judicial-ai-platform:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: judicial-ai-platform:ci
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


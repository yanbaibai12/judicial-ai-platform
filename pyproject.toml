[project]
name = "judicial-ai-platform"
version = "0.2.0"
description = "司法 AI 中台：统一模型推理、公共检索、MCP 工具与数据治理"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.23,<5.0",
    "python-multipart>=0.0.9,<1.0",
    "pypdf>=6.21.4,<7.0",
    "python-docx>=1.1,<2.0",
    "redis>=5.0,<7.0",
    "pymysql>=1.1,<2.0",
    "alembic>=1.20,<2.0",
    "pyjwt[crypto]>=2.8,<3",
    "ldap3>=2.9,<3",
]

[project.optional-dependencies]
production = [
    "neo4j>=5,<6",
    "pymilvus>=2.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judicial_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["src/judicial_ai/models.py"]

# 说明：模型层使用旧式 Column 声明，mypy 会把 ORM 实例属性推断为 Column 类型，
# 产生大量误报。后续迁移到 SQLAlchemy 2.0 Mapped[] 注解后移除以下豁免。
[[tool.mypy.overrides]]
module = [
    "judicial_ai.acl",
    "judicial_ai.services.capabilities",
    "judicial_ai.services.governance",
    "judicial_ai.services.retrieval",
    "judicial_ai.services.mcp_hub",
    "judicial_ai.services.jobs",
    "judicial_ai.services.vector_store",
    "judicial_ai.services.graph_store",
    "judicial_ai.api.retrieval",
    "judicial_ai.api.governance",
    "judicial_ai.api.jobs",
    "judicial_ai.api.health",
    "judicial_ai.api.admin",
    "judicial_ai.api.gateway",
    "judicial_ai.seed",
    "judicial_ai.errors",
]
disable_error_code = [
    "assignment",
    "arg-type",
    "no-redef",
    "var-annotated",
    "return-value",
    "call-overload",
    "misc",
]

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "pandas",
    "pandas.*",
    "pymilvus",
    "pymilvus.*",
    "neo4j",
    "neo4j.*",
    "grpc",
    "grpc.*",
]
follow_imports = "skip"
ignore_missing_imports = true




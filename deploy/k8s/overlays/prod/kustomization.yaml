apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: judicial-ai
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: judicial-ai-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4"
  - target:
      kind: HorizontalPodAutoscaler
      name: judicial-ai-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
images:
  - name: judicial-ai-platform
    newTag: 0.2.0
  - name: judicial-ai-backup
    newTag: 0.2.0

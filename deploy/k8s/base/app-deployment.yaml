apiVersion: v1
kind: ServiceAccount
metadata:
  name: judicial-ai
  namespace: judicial-ai
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: judicial-ai-api
  namespace: judicial-ai
  labels:
    app.kubernetes.io/name: judicial-ai-api
    app.kubernetes.io/part-of: judicial-ai-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: judicial-ai-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: judicial-ai-api
        app.kubernetes.io/part-of: judicial-ai-platform
    spec:
      serviceAccountName: judicial-ai
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: judicial-ai-api
      containers:
        - name: api
          image: judicial-ai-platform:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: judicial-ai-config
            - secretRef:
                name: judicial-ai-secrets
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 4
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 8"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: judicial-ai-api
  namespace: judicial-ai
  labels:
    app.kubernetes.io/name: judicial-ai-api
    app.kubernetes.io/part-of: judicial-ai-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: judicial-ai-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

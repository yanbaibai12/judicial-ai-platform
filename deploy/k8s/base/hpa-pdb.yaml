apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: judicial-ai-api
  namespace: judicial-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: judicial-ai-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: judicial-ai-api
  namespace: judicial-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: judicial-ai-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: judicial-ai-worker
  namespace: judicial-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: judicial-ai-worker

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: judicial-ai-backups
  namespace: judicial-ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: judicial-ai-backup
  namespace: judicial-ai
spec:
  schedule: "0 2 * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: backup
              image: judicial-ai-backup:0.2.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: judicial-ai-secrets
              env:
                - name: BACKUP_DIR
                  value: /backups
                - name: RETENTION_DAYS
                  value: "30"
                # DATABASE_URL 由 judicial-ai-secrets 提供（backup.sh 用于 pg_dump）
                - name: NEO4J_BACKUP_CMD
                  value: ""
                - name: MINIO_ALIAS
                  value: ""
                - name: MC_CONFIG_DIR
                  value: /tmp/mc
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: judicial-ai-backups
            - name: tmp
              emptyDir: {}


name: judicial-ai-platform

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ai_platform
      MYSQL_USER: ai
      MYSQL_PASSWORD: ai_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 2G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: judicial-ai-platform:0.2.0
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      ALLOW_STATIC_ADMIN: ${ALLOW_STATIC_ADMIN:-true}
      DATABASE_URL: mysql+pymysql://ai:ai_password@mysql:3306/ai_platform?charset=utf8mb4
      AUTO_CREATE_SCHEMA: "true"
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: ${VECTOR_BACKEND:-milvus}
      MILVUS_URI: http://milvus:19530
      GRAPH_ENABLED: ${GRAPH_ENABLED:-true}
      GRAPH_BACKEND: ${GRAPH_BACKEND:-neo4j}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_password
      INFERENCE_MODE: mock
      EMBEDDING_DIM: "1024"
      JOB_MODE: worker
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SECURITY_HEADERS_ENABLED: "true"
      RATE_LIMIT_FAIL_OPEN: "false"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: judicial-ai-platform:0.2.0
    restart: unless-stopped
    command: ["python", "-m", "judicial_ai.worker"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: mysql+pymysql://ai:ai_password@mysql:3306/ai_platform?charset=utf8mb4
      AUTO_CREATE_SCHEMA: "true"
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: ${VECTOR_BACKEND:-milvus}
      MILVUS_URI: http://milvus:19530
      GRAPH_ENABLED: ${GRAPH_ENABLED:-true}
      GRAPH_BACKEND: ${GRAPH_BACKEND:-neo4j}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_password
      INFERENCE_MODE: mock
      JOB_MODE: worker
      NODE_ID: ${WORKER_NODE_ID:-1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: judicial-ai-platform:0.2.0
    profiles: ["ops"]
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: mysql+pymysql://ai:ai_password@mysql:3306/ai_platform?charset=utf8mb4
      AUTO_CREATE_SCHEMA: "false"
    depends_on:
      mysql:
        condition: service_healthy

  vllm:
    image: vllm/vllm-openai:v0.8.5
    profiles: ["gpu"]
    command:
      - --model=/models/Qwen3-8B
      - --served-model-name=Qwen3-8B
      - --max-model-len=16384
      - --gpu-memory-utilization=0.90
      - --enable-lora
      - --max-loras=4
      - --max-lora-rank=64
    ports:
      - "8000:8000"
    volumes:
      - ../../models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:



# 司法 AI 中台 —— 真实后端联调环境（Milvus / Neo4j / Redis）
# 用法：docker compose -f deploy/docker-compose.backends.yml up -d
# 停止并保留数据：docker compose -f deploy/docker-compose.backends.yml stop
# 停止并删除数据：docker compose -f deploy/docker-compose.backends.yml down -v

name: judicial-ai-backends

services:
  milvus:
    # 单机模式：内嵌 etcd + 本地存储（Rocksmq），联调最简拓扑
    image: milvusdb/milvus:v2.4.15
    container_name: jai-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: "local"
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC（SDK 连接端口）
      - "9091:9091"     # metrics
      - "9092:9092"     # healthz
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: jai-neo4j
    environment:
      NEO4J_AUTH: neo4j/jai-neo4j-dev
      # 内存按联调机器调小；生产用 K8s Helm 部署
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
      - neo4j_data:/data
    ports:
      - "7687:7687"     # Bolt（SDK 连接端口）
      - "7474:7474"     # HTTP 浏览器控制台
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jai-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  milvus_data:
  neo4j_data:
  redis_data:
